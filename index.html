<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>半円描画アプリ</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: sans-serif;
    }
    #controls {
      margin: 1em;
    }
    canvas {
      border: 1px solid #ccc;
    }

</head>
<body>
  <div id="controls">
    <label for="countInput">n = </label>
    <input type="number" id="countInput" value="3" min="1" />

  </div>

  <!-- ここを変更: height を 300px に -->
  <canvas id="myCanvas" width="600" height="300"></canvas>  <!-- この行を変更 -->
  <script src="semicircles.js"></script>

</html>
